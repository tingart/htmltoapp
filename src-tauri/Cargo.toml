[package]
name = "htmltoapp-shell"
version = "1.0.0"
description = "Reusable Tauri v2 runtime shell for HTML to App"
authors = ["htmltoapp contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "htmltoapp_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
