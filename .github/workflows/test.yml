name: Verify dashboard and build tooling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked JavaScript tools
        run: npm ci
      - name: Test ZIP, browser runtime, relay, and packager
        run: npm test
      - name: Build static dashboard
        run: npm run build
      - name: Compile Python scripts
        run: python3 -m py_compile build-system/scripts/*.py
